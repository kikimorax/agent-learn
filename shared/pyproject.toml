[project]
name = "agent-common"
version = "0.1.0"
description = "Shared configuration for the agent learning stages"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_common"]
